name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 词条一致性检查
        run: node tools/check-i18n.mjs

      - name: 中文覆盖率检查
        run: python tools/check-html.py

      - name: 打包模块
        run: python tools/pack.py

      - uses: actions/upload-artifact@v4
        with:
          name: brene-zh-module
          path: dist/*.zip

      - name: 按 tag 发 release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
